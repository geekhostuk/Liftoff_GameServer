services:
  desktop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: liftoff-desktop
    network_mode: host
    environment:
      - DISPLAY=:1
      - RESOLUTION=1920x1080x24
      - SELKIES_PORT=31264
    volumes:
      - steam-data:/home/gamer/.steam
      - liftoff-mods:/home/gamer/.steam/steam/steamapps/common/Liftoff/BepInEx/plugins
    shm_size: "4g"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  desktop2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: liftoff-desktop-2
    network_mode: host
    environment:
      - DISPLAY=:2
      - RESOLUTION=1920x1080x24
      - SELKIES_PORT=31265
    volumes:
      - steam-data-2:/home/gamer/.steam
      - liftoff-mods-2:/home/gamer/.steam/steam/steamapps/common/Liftoff/BepInEx/plugins
    shm_size: "4g"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  steam-data:
    name: liftoff-steam-data
  liftoff-mods:
    name: liftoff-bepinex-mods
  steam-data-2:
    name: liftoff-steam-data-2
  liftoff-mods-2:
    name: liftoff-bepinex-mods-2
